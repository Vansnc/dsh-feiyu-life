name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 语法检查
        run: npm run check
      - name: 单元测试
        run: npm test
      - name: 打包自检（看会发出去哪些文件）
        run: npm pack --dry-run

